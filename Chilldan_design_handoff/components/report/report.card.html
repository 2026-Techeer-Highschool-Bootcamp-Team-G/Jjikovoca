</head><body><div id="root"></div><script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { DonutChart, MiniBarChart, StreakGrid } = window.DesignSystem_1cf846
const mix = [
  { label: '알아요', value: 62, color: 'var(--color-rating-know)' },
  { label: '헷갈려요', value: 24, color: 'var(--color-rating-confused)' },

</>)
