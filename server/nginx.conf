# nginx 리버스 프록시 (13 §8·§10). 호스트 게이트웨이(기본 8000) → server 컨테이너:8000.
# 프론트 Vite proxy(/api·/images → localhost:8000)가 이 nginx를 그대로 거쳐 server로 간다(오리진 불변, sync 유지).
worker_processes auto;
events { worker_connections 1024; }

http {
  # 캡처 대용량 이미지(형광펜/네모박스 base64, 실사진 4MB+) — 기본 1m이면 413. 여유롭게.
  client_max_body_size 20m;

  # 백엔드 업스트림 — compose 서비스명 server, 내부 포트 8000.
  upstream backend {
    server server:8000;
  }

  server {
    listen 80;

    # /api·/images·/api/health 등 전부 백엔드로. (프론트는 상대경로만 쓰므로 단일 location으로 충분)
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE(분석 진행 스트림 /api/cards/analyze/{id}/events) 안전 — 버퍼링 끄고 타임아웃 넉넉히.
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }
  }
}
