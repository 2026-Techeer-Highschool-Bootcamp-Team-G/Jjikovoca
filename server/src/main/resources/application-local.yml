# 로컬 — docker compose up -d mysql redis 후 IDE bootRun (13 §8-3 개발 루프)
spring:
  datasource:
    # 호스트 IDE bootRun은 localhost(기본), 컨테이너(full 프로파일)는 DB_HOST=mysql 주입 — 한 프로파일로 양쪽 동작.
    url: jdbc:mysql://${DB_HOST:localhost}:3306/jjikeoboka?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USER:jjik}
    password: ${DB_PASSWORD:jjik}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 로컬은 모의 Gemini 프로파일 허용 (키 없는 팀원 — 기존 "모의 AI 모드" 승계, 13 §8-4)
gemini:
  mock: ${GEMINI_MOCK:true}

# 로컬 CORS — 브라우저 프론트(Vite dev)는 항상 Origin을 붙이므로 localhost를 허용해야 개발이 된다.
# 공통 기본값(application.yml)은 배포 도메인만이라, 로컬 프로파일에서 localhost를 더해 override한다.
# (prod는 실제 프론트 도메인만 유지 — 여기 값은 local 프로파일에만 적용)
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5200,https://jjikovoca.site,https://www.jjikovoca.site
