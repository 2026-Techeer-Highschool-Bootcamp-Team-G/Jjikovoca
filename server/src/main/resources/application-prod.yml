# 프로덕션 — EC2. 시크릿은 SSM Parameter Store에서 환경변수 주입 (08 §7, 이미지에 설정 없음)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/jjikeoboka?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

# nginx(리버스 프록시) 뒤 — Tomcat이 신뢰 프록시(사설 대역)가 붙인 X-Forwarded-For/Proto만 반영해
# getRemoteAddr()가 실제 클라이언트 IP가 된다(rate limit 키, P1-11 D). 앱은 XFF를 직접 읽지 않는다.
server:
  forward-headers-strategy: native

gemini:
  mock: false
  api-key: ${GEMINI_API_KEY}

app:
  export:
    renderer: ${APP_EXPORT_RENDERER:chromium}   # prod는 디자인 PDF(word-test.html) 위해 chromium. 이미지에 Chromium·한글폰트 포함(Dockerfile)

logging:
  level:
    org.hibernate.SQL: warn        # prod에선 SQL 로그 off
  # TODO(07): logback JSON 인코더 + traceId(OTel MDC) 주입
