name: ci

# PR 게이트 — server/ 변경 PR에서 빌드+테스트(ArchUnit 슬라이스 경계 포함)를 돌려
# 깨진 코드가 main에 들어오지 못하게 한다. 프론트(web/)·문서 변경으로는 돌지 않는다(경로 필터).
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # 프로젝트 필수 JDK 21(gradle daemon toolchain 고정)

      - name: Gradle 설정(캐시)
        uses: gradle/actions/setup-gradle@v4

      # ArchUnit 등 테스트가 Testcontainers(MySQL)를 쓰면 ubuntu-latest의 Docker로 기동된다.
      - name: Build (검증 + 테스트)
        working-directory: server
        run: ./gradlew build --no-daemon --console=plain
