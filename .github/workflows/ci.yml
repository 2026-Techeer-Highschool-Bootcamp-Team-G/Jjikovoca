name: ci

# PR 게이트 — 모든 PR에서 트리거하되, server 변경이 있을 때만 빌드+테스트를 돌린다.
# build 체크를 항상 생성해 룰셋 필수 체크를 충족시키고, server 무관 PR(설정·문서·프론트)은 스킵-통과시킨다.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # server(또는 이 워크플로) 변경 여부 감지 — 변경이 없으면 빌드를 건너뛰어 몇 초 만에 통과시킨다.
      - name: 변경 경로 감지
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

      - name: Set up JDK 21
        if: steps.changes.outputs.server == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # 프로젝트 필수 JDK 21(gradle daemon toolchain 고정)

      - name: Gradle 설정(캐시)
        if: steps.changes.outputs.server == 'true'
        uses: gradle/actions/setup-gradle@v4

      # ArchUnit 등 테스트가 Testcontainers(MySQL)를 쓰면 ubuntu-latest의 Docker로 기동된다.
      - name: Build (검증 + 테스트)
        if: steps.changes.outputs.server == 'true'
        working-directory: server
        run: ./gradlew build --no-daemon --console=plain

      - name: server 변경 없음 — 빌드 스킵(통과)
        if: steps.changes.outputs.server != 'true'
        run: echo "server 변경 없음 — build를 건너뛰고 통과합니다."
