<!-- @dsCard group="Colors" viewport="700x150" name="알/헷/몰 · 잔디" subtitle="3단계 자기평가 색과 학습 잔디 4단 스케일" -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--color-bg-secondary);font-family:var(--font-sans);display:flex;gap:24px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.cap{font-size:10px;color:var(--color-text-tertiary)}
.g{width:22px;height:22px;border-radius:5px}
</style></head><body>
<div class="col">
  <div class="row">
    <span class="chip" style="background:var(--color-rating-know-weak);color:var(--color-rating-know)">알 6</span>
    <span class="chip" style="background:var(--color-rating-confused-weak);color:var(--color-rating-confused)">헷 2</span>
    <span class="chip" style="background:var(--color-rating-dont-know-weak);color:var(--color-rating-dont-know)">몰 7</span>
  </div>
  <span class="cap">--color-rating-know #3182f6 · confused #e07a1e · dont-know #f04452</span>
</div>
<div class="col">
  <div class="row">
    <span class="g" style="background:var(--color-grass-0)"></span>
    <span class="g" style="background:var(--color-grass-1)"></span>
    <span class="g" style="background:var(--color-grass-2)"></span>
    <span class="g" style="background:var(--color-grass-3)"></span>
    <span class="g" style="background:var(--color-grass-4)"></span>
  </div>
  <span class="cap">--color-grass-0…4 · 학습 잔디는 초록이 아니라 브랜드 파랑 계열</span>
</div>
</body></html>
