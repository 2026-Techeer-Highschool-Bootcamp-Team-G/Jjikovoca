<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-bg-primary);font-family:var(--font-sans);color:var(--color-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;margin-top:6px;color:var(--color-text-secondary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.v{font-size:11px;color:var(--color-text-tertiary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="n">--color-accent</div><div class="v">#ffd84d</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-strong)"></div><div class="n">--color-accent-strong</div><div class="v">#ffc93d</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-weak)"></div><div class="n">--color-accent-weak</div><div class="v">#fff3d1</div></div>
<div class="sw"><div class="chip" style="background:var(--highlight-300)"></div><div class="n">--highlight-300</div><div class="v">#ffe45e</div></div>
<div class="sw"><div class="chip" style="background:var(--yellow-500)"></div><div class="n">--yellow-500</div><div class="v">#ffc342</div></div>
<div class="sw"><div class="chip" style="background:var(--yellow-900)"></div><div class="n">--yellow-900</div><div class="v">#4a3b14</div></div>
</div></body></html>
