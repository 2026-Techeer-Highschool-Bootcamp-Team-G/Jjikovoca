<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-bg-primary);font-family:var(--font-sans);color:var(--color-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;margin-top:6px;color:var(--color-text-secondary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.v{font-size:11px;color:var(--color-text-tertiary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></head><body><div class="g">

</div></body></html>
